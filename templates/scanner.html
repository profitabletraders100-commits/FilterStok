<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NSE Morning Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body { background: linear-gradient(135deg, #0a0e1a 0%, #0f172a 50%, #1e1b4b 100%); color: #fff; min-height: 100vh; font-family: 'Segoe UI', sans-serif; }
        .header { background: rgba(17,24,39,.9); border-bottom: 2px solid rgba(59,130,246,.5); padding: 14px 20px; position: sticky; top: 0; z-index: 10; }
        .header h3 { background: linear-gradient(135deg,#60a5fa,#a78bfa,#f59e0b); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 800; margin: 0; }
        .panel { background: rgba(17,24,39,.85); border: 1px solid rgba(59,130,246,.4); border-radius: 16px; padding: 16px; margin-bottom: 20px; }
        .pick { background: rgba(31,41,55,.9); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; border-left: 4px solid #3b82f6; }
        .pick.long { border-left-color: #10b981; }
        .pick.short { border-left-color: #ef4444; }
        .score { font-size: 1.4rem; font-weight: 800; }
        .bar { height: 6px; background: #374151; border-radius: 3px; overflow: hidden; }
        .bar > div { height: 100%; background: linear-gradient(90deg,#3b82f6,#8b5cf6); }
        .reason { font-size: 12px; color: #cbd5e1; }
        .muted { color: #94a3b8; font-size: 13px; }
        a.sym { color: #60a5fa; font-weight: 700; text-decoration: none; font-size: 1.1rem; }
        .tab-btn { padding: 8px 18px; border: 1px solid rgba(59,130,246,.4); background: rgba(31,41,55,.8); color: #e2e8f0; border-radius: 30px; margin: 4px; }
        .tab-btn.active { background: linear-gradient(135deg,#3b82f6,#8b5cf6); color: #fff; }
        .btn-run { background: linear-gradient(135deg,#3b82f6,#8b5cf6); border: none; color: #fff; border-radius: 20px; padding: 6px 16px; font-weight: 600; }
    </style>
</head>
<body>
<div class="header d-flex flex-wrap justify-content-between align-items-center gap-2">
    <div>
        <h3>🎯 NSE Morning Scanner</h3>
        <div class="muted">F&amp;O universe from NSE every 3 min · morning pick frozen at 09:54 IST · <a href="/" class="text-info">OI dashboard</a></div>
    </div>
    <div class="text-end">
        <div id="status" class="muted">Loading…</div>
        <button class="btn-run mt-1" onclick="runNow()">⚡ Scan now</button>
    </div>
</div>

<div class="container-fluid py-3 px-3">
    <div class="text-center mb-3">
        <button class="tab-btn active" id="tab-morning" onclick="setView('morning')">🌅 Morning pick</button>
        <button class="tab-btn" id="tab-latest" onclick="setView('latest')">📡 Live ranking</button>
        <button class="tab-btn" id="tab-perf" onclick="setView('perf')">📊 Performance</button>
    </div>
    <div id="meta" class="text-center muted mb-3"></div>
    <div id="perf" style="display:none"></div>
    <div class="row" id="picks">
        <div class="col-lg-6"><div class="panel"><h5 class="text-success">🟢 Long</h5><div id="longs"></div></div></div>
        <div class="col-lg-6"><div class="panel"><h5 class="text-danger">🔴 Short</h5><div id="shorts"></div></div></div>
    </div>
</div>

<script>
    let view = 'morning';
    let cache = null;

    function setView(v) {
        view = v;
        document.getElementById('tab-morning').classList.toggle('active', v === 'morning');
        document.getElementById('tab-latest').classList.toggle('active', v === 'latest');
        document.getElementById('tab-perf').classList.toggle('active', v === 'perf');
        document.getElementById('picks').style.display = v === 'perf' ? 'none' : '';
        document.getElementById('perf').style.display = v === 'perf' ? '' : 'none';
        if (v === 'perf') loadPerf(); else render();
    }

    function esc(s) {
        return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    function pickHtml(p, i) {
        const cls = p.side === 'LONG' ? 'long' : 'short';
        const chg = p.change_pct >= 0 ? `+${p.change_pct.toFixed(2)}` : p.change_pct.toFixed(2);
        return `<div class="pick ${cls}">
            <div class="d-flex justify-content-between align-items-center">
                <div>${i + 1}. <a class="sym" target="_blank" href="https://www.tradingview.com/chart/?symbol=NSE:${encodeURIComponent(p.symbol)}">${esc(p.symbol)}</a>
                    <span class="ms-2">₹${p.price.toLocaleString('en-IN')}</span>
                    <span class="ms-2 ${p.change_pct >= 0 ? 'text-success' : 'text-danger'}">${chg}%</span></div>
                <div class="score">${p.score}</div>
            </div>
            <div class="bar my-1"><div style="width:${Math.min(100, p.score)}%"></div></div>
            <div class="reason">${p.reasons.map(esc).join(' · ')}</div>
            <div class="muted mt-1">Gap ${p.gap_pct}% · Turnover ₹${p.turnover_cr} cr${p.pcr != null ? ` · PCR ${p.pcr}` : ''}</div>
        </div>`;
    }

    function render() {
        const longs = document.getElementById('longs');
        const shorts = document.getElementById('shorts');
        const meta = document.getElementById('meta');
        const r = cache && (view === 'morning' ? cache.morning_pick : cache.latest);
        if (!r) {
            const msg = view === 'morning'
                ? 'Morning pick is published by the 09:54 IST scan (ready before 10:00).'
                : 'No scan yet today. Scans run every 3 minutes from 09:15 IST.';
            meta.innerHTML = '';
            longs.innerHTML = shorts.innerHTML = `<div class="muted">${msg}</div>`;
            return;
        }
        meta.innerHTML = `${r.date} · data at ${r.time_display} IST · ${r.universe_size} stocks scanned · ${r.eligible} passed filters`
            + (r.late ? ' · <span class="text-warning">published after 10:00 (scanner started late)</span>' : '');
        longs.innerHTML = r.longs.length ? r.longs.map(pickHtml).join('') : '<div class="muted">No long setups</div>';
        shorts.innerHTML = r.shorts.length ? r.shorts.map(pickHtml).join('') : '<div class="muted">No short setups</div>';
    }

    async function load() {
        try {
            const res = await fetch('/api/scan/latest');
            const data = await res.json();
            const st = data.status || {};
            document.getElementById('status').innerHTML =
                (st.running ? '⏳ scanning… ' : '') +
                (st.last_run ? `Last scan ${st.last_run}` : 'No scan yet') +
                (st.last_error ? ` · <span class="text-danger">${esc(st.last_error)}</span>` : '');
            cache = data.success ? data : null;
            if (view !== 'perf') render();
        } catch (e) {
            document.getElementById('status').innerHTML = '<span class="text-danger">Server unreachable</span>';
        }
    }

    function pct(v) {
        if (v === null || v === undefined) return '–';
        const cls = v > 0 ? 'text-success' : v < 0 ? 'text-danger' : '';
        return `<span class="${cls}">${v > 0 ? '+' : ''}${v}%</span>`;
    }

    function statRow(name, s) {
        if (!s || !s.trades) return `<tr><td>${name}</td><td colspan="5" class="muted">no trades yet</td></tr>`;
        return `<tr><td>${name}</td><td>${s.trades}</td><td>${s.win_rate}%</td><td>${pct(s.avg_return)}</td>
                <td>${pct(s.total_return)}</td><td>${s.profit_factor ?? '–'}</td></tr>`;
    }

    async function loadPerf() {
        document.getElementById('meta').innerHTML = '';
        const box = document.getElementById('perf');
        box.innerHTML = '<div class="text-center muted">Loading…</div>';
        try {
            const r = await (await fetch('/api/performance')).json();
            const st = r.settings;
            if (!r.overall || !r.overall.trades) {
                box.innerHTML = `<div class="panel text-center muted">No results yet. Each trading day the 09:54 picks are tracked
                    until ${st.exit_time} (SL ${st.stop_loss_pct}%, target ${st.target_pct}%). Check back after the first full day.</div>`;
                return;
            }
            const head = '<tr><th></th><th>Trades</th><th>Win</th><th>Avg</th><th>Total</th><th>PF</th></tr>';
            const sig = Object.entries(r.signals).map(([k, v]) =>
                `<tr><td>${esc(k)}</td><td>${pct(v.strong_avg)} <span class="muted">(${v.strong_n})</span></td>
                 <td>${pct(v.weak_avg)} <span class="muted">(${v.weak_n})</span></td></tr>`).join('');
            const daily = r.daily.slice().reverse().map(d =>
                `<tr><td>${d.date}${d.complete ? '' : ' <span class="text-warning">(partial)</span>'}</td><td>${d.trades || 0}</td>
                 <td>${d.trades ? d.win_rate + '%' : '–'}</td><td>${pct(d.avg_return)}</td><td>${pct(d.total_return)}</td></tr>`).join('');
            box.innerHTML = `
                <div class="muted text-center mb-3">${r.days} day(s) · entry ${esc(st.entry)} · SL ${st.stop_loss_pct}% · target ${st.target_pct}% · exit ${st.exit_time}
                    · exits: ${Object.entries(r.exit_reasons).map(([k, v]) => `${k} ${v}`).join(', ')}</div>
                <div class="row">
                    <div class="col-lg-6"><div class="panel"><h5>Summary</h5><div class="table-responsive">
                        <table class="table table-dark table-sm mb-0">${head}
                        ${statRow('All', r.overall)}${statRow('Long', r.by_side.LONG)}${statRow('Short', r.by_side.SHORT)}
                        ${Object.entries(r.by_rank).sort((a, b) => parseInt(a[0].slice(4)) - parseInt(b[0].slice(4))).map(([k, v]) => statRow(k.replace('_', ' '), v)).join('')}
                        </table></div></div></div>
                    <div class="col-lg-6"><div class="panel"><h5>Which signals work?</h5>
                        <div class="muted mb-2">Avg return when the signal was strong vs weak (trade count)</div>
                        <div class="table-responsive"><table class="table table-dark table-sm mb-0">
                        <tr><th>Signal</th><th>Strong</th><th>Weak</th></tr>${sig}</table></div></div></div>
                </div>
                <div class="panel"><h5>Daily</h5><div class="table-responsive"><table class="table table-dark table-sm mb-0">
                    <tr><th>Date</th><th>Trades</th><th>Win</th><th>Avg</th><th>Total</th></tr>${daily}</table></div></div>`;
        } catch (e) {
            box.innerHTML = '<div class="panel text-danger">Could not load performance</div>';
        }
    }

    async function runNow() {
        const res = await fetch('/api/scan/run', { method: 'POST' });
        const data = await res.json();
        document.getElementById('status').innerHTML = data.success ? '⏳ scanning…' : esc(data.error);
        setTimeout(load, 5000);
    }

    load();
    setInterval(load, 30000);
</script>
</body>
</html>
